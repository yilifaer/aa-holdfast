name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        # Every Alliance Auth line we promise to run on: 5.2 and 5.4 pinned
        # with the django-esi 9.10 they shipped alongside, and "latest" --
        # whatever pip resolves today, which is how a new install gets it.
        # django-esi is pinned with the older two because AA 5.5 moved to its
        # 10.x line, and the ESI client API is where upgrades bite.
        alliance-auth: ["5.2", "5.4", "latest"]

    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # AA 5.2 leaves django-sri unpinned; django-sri 1.0 (Python 3.11+)
          # drops the sri_static tag AA 5.2's own templates use. AA 5.4+ pins
          # <1, and so does this app, but the pin has to be here too or pip
          # resolves 1.0 first and the install is already broken.
          case "${{ matrix.alliance-auth }}" in
            5.2) pip install "allianceauth~=5.2.0" "django-esi~=9.10.0" "django-sri<1" ;;
            5.4) pip install "allianceauth~=5.4.0" "django-esi~=9.10.0" ;;
          esac
          pip install -e .
          pip install ruff build twine
          python -c "import allianceauth, esi; print('allianceauth', allianceauth.__version__, '| django-esi', esi.__version__)"

      - name: Lint
        run: ruff check holdfast tests

      # sqlite and a cut-down settings module, so this takes seconds rather
      # than migrating a whole Alliance Auth project. See tests/settings.py.
      - name: Test
        run: python runtests.py

      # A wheel that builds but cannot be uploaded is found at the worst
      # possible moment, so it is checked on every push instead.
      - name: Build and check the package
        run: |
          python -m build
          python -m twine check dist/*
