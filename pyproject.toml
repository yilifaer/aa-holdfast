[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aa-holdfast"
dynamic = ["version"]
description = "Sovereignty hub fuel, orbital skyhooks and mercenary dens for Alliance Auth, on the Equinox ESI routes."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Invidia Gloriae Comes" }]
keywords = ["eve online", "allianceauth", "sovereignty", "skyhook", "mercenary den", "nullsec", "esi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
dependencies = [
    "allianceauth>=5.2",         # 5.2, 5.4 and latest are what CI installs
    # Alliance Auth 5.2 leaves this open, and django-sri 1.0 (Python 3.11+,
    # September 2026) drops the sri_static tag that AA 5.2's own base template
    # uses -- every page 500s. AA pins <1 from 5.4; this carries the pin back
    # to 5.2 so a fresh install there does not break on a dependency of ours.
    "django-sri<1",
    "django-esi>=9.10",          # compatibility-date support
    "django-eveuniverse>=2.0",   # 0001 depends on its migration 0012
    "dhooks-lite>=1.1",
    # Notification bodies are YAML, anchors and all. Alliance Auth happens to
    # require this too, but depending on somebody else's dependency is how an
    # install breaks on a day nothing here changed.
    "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/yilifaer/aa-holdfast"
Source = "https://github.com/yilifaer/aa-holdfast"
Changelog = "https://github.com/yilifaer/aa-holdfast/blob/main/CHANGELOG.md"
Issues = "https://github.com/yilifaer/aa-holdfast/issues"

[tool.setuptools.packages.find]
include = ["holdfast*"]
# The suite runs from a checkout (runtests.py); an installed copy has no
# settings for it and nothing to test against.
exclude = ["holdfast.tests*"]

[tool.setuptools.dynamic]
version = { attr = "holdfast.__version__" }

[tool.setuptools.package-data]
holdfast = ["templates/**/*", "static/**/*", "locale/**/*"]

[tool.ruff]
line-length = 90
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "DJ"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*" = ["E501", "I"]
